<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Hydration Tracker</title>
<meta name="description" content="A private, offline hydration and urination tracker. All data stays on your device." />

<!-- Theme color matches the app's own background so the OS status bar blends
     seamlessly into the app instead of showing as a separate black bar. -->
<meta name="theme-color" content="#EEF3FA" />
<link rel="manifest" href="manifest.json" />

<!-- Standard + maskable icons for Android/desktop install -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

<!-- iOS: enables standalone (no browser chrome) when launched from the
     home screen, lets content draw under the status bar, and sets the
     home-screen icon/name since iOS ignores the web manifest for these. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Hydration Tracker" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- App shell -->
<div id="app">

  <!-- Top bar -->
  <header class="topbar" id="topbar">
    <!-- populated by JS per-screen -->
  </header>

  <!-- Install prompt (shown when installable / on iOS as a manual instruction) -->
  <div id="install-banner"></div>

  <!-- Main content, screens render here -->
  <main id="app-main" class="app-main" role="main"></main>

  <!-- Toast -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- Modal root -->
  <div id="modal-root"></div>

  <!-- Bottom navigation -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="Primary">
    <button class="nav-item" data-route="dashboard" aria-label="Home">
      <svg viewBox="0 0 24 24" class="nav-icon"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5a.5.5 0 0 1-.5-.5V15h-4v5.5a.5.5 0 0 1-.5.5H5a1 1 0 0 1-1-1v-8.5z"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" data-route="history" aria-label="History">
      <svg viewBox="0 0 24 24" class="nav-icon"><path d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-2.05-4.95L14 10h6V4l-2.2 2.2A9 9 0 0 0 12 3z"/><path d="M12 7v6l4 2"/></svg>
      <span>History</span>
    </button>
    <button class="nav-item" data-route="stats" aria-label="Stats">
      <svg viewBox="0 0 24 24" class="nav-icon"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
      <span>Stats</span>
    </button>
  </nav>

</div>

<script src="app.js"></script>
</body>
</html>
